apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ingest
  labels: {{- include "readyline.labels" . | nindent 4 }}
spec:
  # Consumer-group members. Scaling past the topic's partition count buys nothing -- the extra
  # pods idle, because a partition is consumed by exactly one member.
  replicas: {{ min .Values.ingest.replicas (int .Values.externalServices.redpanda.partitions) }}
  selector:
    matchLabels: {app.kubernetes.io/name: readyline, component: ingest}
  template:
    metadata:
      labels: {app.kubernetes.io/name: readyline, component: ingest}
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Offsets commit only after ClickHouse acknowledges, so a kill mid-batch replays it and
      # the Bloom filter absorbs the duplicates. This grace period lets an in-flight batch land.
      terminationGracePeriodSeconds: 45
      containers:
        - name: ingest
          image: "{{ .Values.image.repository }}-ingest:{{ .Values.image.tag }}"
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            {{- include "readyline.env" . | nindent 12 }}
            - name: INGEST_BATCH_ROWS
              value: {{ .Values.ingest.batchRows | quote }}
            - name: INGEST_BATCH_SECONDS
              value: {{ .Values.ingest.batchSeconds | quote }}
          resources: {{- toYaml .Values.ingest.resources | nindent 12 }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
